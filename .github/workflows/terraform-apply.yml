name: "Terraform Apply"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      aws_region:
        description: "Region to deploy to (use a non-default region for disaster recovery)"
        default: "eu-west-1"
        type: string

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.10.5"
  AWS_DEFAULT_REGION: ${{ inputs.aws_region || 'eu-west-1' }}
  TF_VAR_aws_region: ${{ inputs.aws_region || 'eu-west-1' }}
  # Each region has its own state; eu-west-1 keeps the original key.
  TF_STATE_KEY: ${{ (inputs.aws_region || 'eu-west-1') == 'eu-west-1' && 'terraform.tfstate' || format('regions/{0}/terraform.tfstate', inputs.aws_region) }}
  # Public key for the EC2 key pair that Terraform creates.
  TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

jobs:
  terraform-apply:
    name: "Apply Terraform"
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: terraform-apply-main
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Debug OIDC
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
          audience: sts.amazonaws.com

      - name: Terraform Init
        run: terraform init -backend-config="key=$TF_STATE_KEY"

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false tfplan

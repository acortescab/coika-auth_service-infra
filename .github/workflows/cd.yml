name: CD

on:
  push:
    branches: [main]
    paths:
      - "*.tf"
      - "**/*.tf"
      - ".terraform.lock.hcl"
      - "user_data.sh"
      - "db_bootstrap.sh"
      - "db/**"
      - ".github/workflows/cd.yml"
  workflow_dispatch:
    inputs:
      aws_region:
        description: "Region to deploy to (use a non-default region for disaster recovery)"
        default: "eu-west-1"
        type: string

# One run at a time: killing a plan or apply halfway can leave the state locked or half applied.
concurrency:
  group: terraform-cd
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_DEFAULT_REGION: ${{ inputs.aws_region || 'eu-west-1' }}
  TF_VAR_aws_region: ${{ inputs.aws_region || 'eu-west-1' }}
  # Each region has its own state; eu-west-1 keeps the original key.
  TF_STATE_KEY: ${{ (inputs.aws_region || 'eu-west-1') == 'eu-west-1' && 'terraform.tfstate' || format('regions/{0}/terraform.tfstate', inputs.aws_region) }}

jobs:
  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.6
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Terraform init
        env:
          TFSTATE_BUCKET: ${{ vars.TFSTATE_BUCKET }}
        run: terraform init -backend-config="bucket=$TFSTATE_BUCKET" -backend-config="key=$TF_STATE_KEY"

      - name: Terraform plan
        id: plan
        env:
          TF_VAR_tfstate_bucket_name: ${{ vars.TFSTATE_BUCKET }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          # Exit codes: 0 no changes, 2 changes, 1 error. Only 1 fails the job.
          set +e
          terraform plan -input=false -no-color -lock-timeout=5m -detailed-exitcode -out=tfplan
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 1 ]; then
            exit 1
          fi

      - name: Plan to job summary
        if: steps.plan.outputs.exitcode == '2'
        run: |
          terraform show -no-color tfplan > plan.txt
          {
            echo '### Terraform plan'
            echo '```'
            head -c 60000 plan.txt
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan
          path: tfplan
          retention-days: 1
          if-no-files-found: error

  apply:
    name: Terraform apply
    needs: plan
    if: needs.plan.outputs.exitcode == '2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.6
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Download plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan

      - name: Terraform init
        env:
          TFSTATE_BUCKET: ${{ vars.TFSTATE_BUCKET }}
        run: terraform init -backend-config="bucket=$TFSTATE_BUCKET" -backend-config="key=$TF_STATE_KEY"

      # Apply the saved plan the reviewer saw. Terraform rejects it if the state moved since.
      - name: Terraform apply
        run: terraform apply -input=false -no-color -lock-timeout=5m tfplan

  notify-failure:
    name: Notify failure
    needs: [plan, apply]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$REPO" \
            --title "CD failed on ${SHA:0:7}" \
            --body "The CD workflow failed for commit $SHA. Run: $RUN_URL"

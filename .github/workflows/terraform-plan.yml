name: "Terraform PR Plan"

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      aws_region:
        description: "Region to deploy to (use a non-default region for disaster recovery)"
        default: "eu-west-1"
        type: string

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TF_VERSION: "1.10.5"
  AWS_DEFAULT_REGION: ${{ inputs.aws_region || 'eu-west-1' }}
  TF_VAR_aws_region: ${{ inputs.aws_region || 'eu-west-1' }}
  # Each region has its own state; eu-west-1 keeps the original key.
  TF_STATE_KEY: ${{ (inputs.aws_region || 'eu-west-1') == 'eu-west-1' && 'terraform.tfstate' || format('regions/{0}/terraform.tfstate', inputs.aws_region) }}
  # Public key for the EC2 key pair that Terraform creates.
  TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

jobs:
  validate-and-plan:
    name: "Validate & Plan"
    runs-on: ubuntu-latest
    environment: plan
    outputs:
      plan_exit_code: ${{ steps.plan.outputs.exitcode }}
      plan_summary: ${{ steps.summary.outputs.summary }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Debug OIDC
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
          audience: sts.amazonaws.com

      - name: Terraform fmt
        run: terraform fmt -check -diff -recursive

      - name: Terraform Init
        run: terraform init -backend-config="key=$TF_STATE_KEY"

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        continue-on-error: true
        run: |
          # The default shell runs with -e: without the `||`, exit code 2 (changes present) aborts
          # the step before the exit code is saved.
          plan_exit=0
          terraform plan -no-color -out=tfplan -detailed-exitcode || plan_exit=$?
          echo "exitcode=$plan_exit" >> "$GITHUB_OUTPUT"
          if [ "$plan_exit" -eq 1 ]; then
            echo "Terraform plan failed."
            exit 1
          fi

      - name: Generate Plan Summary
        id: summary
        if: github.event_name == 'pull_request'
        run: |
          if [ -f tfplan ]; then
            terraform show -no-color tfplan > plan-output.txt
            summary=$(grep -E "^Plan:|^No changes\." plan-output.txt || true)
            if [ -z "$summary" ]; then
              summary="Plan completed successfully. Check logs for details."
            fi
          else
            summary="Plan file was not generated."
          fi
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

      - name: Comment Plan Summary on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const summary = `${{ steps.summary.outputs.summary }}`;
            const exitCode = `${{ steps.plan.outputs.exitcode }}`;
            const status = exitCode === '0' || exitCode === '2' ? 'Success' : 'Failed';
            const fs = require('fs');
            const fullPlan = fs.readFileSync('plan-output.txt', 'utf8');
            const output = [
              '### Terraform Plan Summary',
              `**Status**: ${status}`,
              `**Plan Exit Code**: \`${exitCode}\``,
              `**Plan Outcome**: ${summary}`,
              '',
              '```hcl',
              fullPlan,
              '```'
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Upload Terraform Plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan
          retention-days: 5

      - name: Fail job on plan errors
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1


# Start it with ./start.sh (loads the credentials from SSM and exports them to compose).
services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:15}
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?run ./start.sh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./start.sh}
      POSTGRES_DB: ${POSTGRES_DB:?run ./start.sh}
      # The root of the ext4 data volume contains lost+found, which initdb refuses; use a subdirectory.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Only the private IP (set by start.sh); the database security group (db_port) limits it to the API host.
      - "${DB_BIND_IP:?run ./start.sh}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # db_data_mount_path: the dedicated EBS volume mounted by db_data_volume.sh
      - /data/postgres:/var/lib/postgresql/data
